name: Login smoke tests

# Runs the Playwright login smoke suite against each PR's Vercel preview
# deployment. Triggers off Vercel's deployment_status webhook so the
# tests run against the URL Vercel actually built, not a local dev server.

on:
  deployment_status:

jobs:
  smoke:
    if: |
      github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment != 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm test:smoke:install

      - name: Run smoke tests
        env:
          SMOKE_BASE_URL: ${{ github.event.deployment_status.target_url }}
          SMOKE_SUPABASE_URL: ${{ secrets.SMOKE_SUPABASE_URL }}
          SMOKE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SMOKE_SUPABASE_SERVICE_ROLE_KEY }}
          SMOKE_SUPER_ADMIN_EMAIL: ${{ secrets.SMOKE_SUPER_ADMIN_EMAIL }}
          CI: "true"
        run: pnpm test:smoke

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
